stages:
  - test
  - deploy

variables:
  PNPM_VERSION: '10.12.1'

.pnpm_setup: &pnpm_setup
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm install --frozen-lockfile

lint_and_test:
  stage: test
  image: node:22-bookworm
  <<: *pnpm_setup
  script:
    - pnpm turbo lint typecheck test build --filter=@ambik/catalog --filter=@ambik/web
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy_production:
  stage: deploy
  image: node:22-bookworm
  <<: *pnpm_setup
  script:
    - pnpm turbo build --filter=@ambik/web
    - cd apps/web && pnpm exec wrangler deploy
  environment:
    name: production
    url: https://ambik.link
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  needs:
    - lint_and_test

include:
  - template: Security/SAST.gitlab-ci.yml
